services:
  - type: web
    name: dividend-blueprint-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python -c "from app.database.base import init_db; init_db()" &&
      python scripts/seed_etfs.py &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: dividend-blueprint-frontend
    env: static
    rootDir: frontend
    buildCommand: >-
      echo "window.API_BASE = \"https://$API_BASE_HOST/api/v1\";" > config.js
    staticPublishPath: .
    envVars:
      - key: API_BASE_HOST
        fromService:
          type: web
          name: dividend-blueprint-api
          property: host
