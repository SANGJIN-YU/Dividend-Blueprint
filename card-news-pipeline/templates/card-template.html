<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1080px;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #0f1116;
    color: #f5f5f7;
  }
  .card {
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    padding: 48px;
  }
  .eyebrow {
    font-size: 24px;
    color: #8b9bff;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .company-name {
    font-size: 56px;
    font-weight: 800;
    margin-top: 8px;
  }
  .as-of {
    font-size: 22px;
    color: #a0a4ad;
    margin-top: 6px;
  }
  .chart-wrap {
    margin-top: 20px;
    background: #ffffff;
    border-radius: 24px;
    padding: 16px;
    display: flex;
    justify-content: center;
  }
  .chart-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }
  .narrative {
    margin-top: 20px;
    font-size: 28px;
    line-height: 1.4;
    font-weight: 500;
  }
  .metrics-row {
    margin-top: auto;
    display: flex;
    gap: 16px;
  }
  .metric-box {
    flex: 1;
    background: #1b1e27;
    border-radius: 18px;
    padding: 16px;
  }
  .metric-label {
    font-size: 18px;
    color: #a0a4ad;
  }
  .metric-value {
    font-size: 28px;
    font-weight: 700;
    margin-top: 6px;
  }
  .disclaimer {
    margin-top: 16px;
    font-size: 14px;
    color: #6b6f78;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">오늘의 화제 기업 · 재무 브리핑</div>
    <div class="company-name">{{COMPANY_NAME}}</div>
    <div class="as-of">{{AS_OF_LABEL}} 공시 기준</div>

    <div class="chart-wrap">
      <img src="{{CHART_IMAGE_SRC}}" alt="최근 4개 분기 매출액/영업이익 추이" />
    </div>

    <div class="narrative">{{NARRATIVE}}</div>

    <div class="metrics-row">
      <div class="metric-box">
        <div class="metric-label">전년동기대비 매출(누적)</div>
        <div class="metric-value">{{REVENUE_YOY}}</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">전년동기대비 영업이익(누적)</div>
        <div class="metric-value">{{OPERATING_PROFIT_YOY}}</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">부채비율</div>
        <div class="metric-value">{{DEBT_RATIO}}</div>
      </div>
    </div>

    <div class="disclaimer">
      본 콘텐츠는 DART 전자공시 데이터를 기반으로 한 사실 요약이며, 투자 권유를 목적으로 하지 않습니다.
    </div>
  </div>
</body>
</html>
